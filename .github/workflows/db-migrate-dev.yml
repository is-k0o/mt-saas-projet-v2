name: db-migrate-dev

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "db/migrations/**"
      - "src/migrations/**"
      - ".github/workflows/db-migrate-dev.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: db-migrate-dev
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: dev

    env:
      # Azure auth (OIDC)
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # DEV (temporary): SQL auth for migrations
      SQL_ADMIN_LOGIN: ${{ vars.SQL_ADMIN_LOGIN }}
      SQL_ADMIN_PASSWORD: ${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init (read outputs)
        working-directory: infra/terraform/environments/dev
        run: terraform init -backend-config=backend.dev.hcl

      - name: Read infra outputs (SQL server + DB names)
        id: tfout
        working-directory: infra/terraform/environments/dev
        shell: bash
        run: |
          set -euo pipefail

          RG="$(terraform output -raw resource_group_name)"
          SQL_SERVER_NAME="$(terraform output -raw sql_server_name)"
          SQL_SERVER_FQDN="$(terraform output -raw sql_server_fqdn)"
          CORE_DB_NAME="$(terraform output -raw core_db_name)"
          DIRECTORY_DB_NAME="$(terraform output -raw directory_db_name)"

          echo "resource_group_name=$RG" >> "$GITHUB_OUTPUT"
          echo "sql_server_name=$SQL_SERVER_NAME" >> "$GITHUB_OUTPUT"
          echo "sql_server_fqdn=$SQL_SERVER_FQDN" >> "$GITHUB_OUTPUT"
          echo "core_db_name=$CORE_DB_NAME" >> "$GITHUB_OUTPUT"
          echo "directory_db_name=$DIRECTORY_DB_NAME" >> "$GITHUB_OUTPUT"

      - name: Allow runner IP on SQL firewall (temporary)
        id: fw
        shell: bash
        run: |
          set -euo pipefail

          RULE_NAME="gha-dbup-${GITHUB_RUN_ID}"
          RUNNER_IP="$(curl -s https://api.ipify.org)"

          echo "rule_name=$RULE_NAME" >> "$GITHUB_OUTPUT"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

          az sql server firewall-rule create             --resource-group "${{ steps.tfout.outputs.resource_group_name }}"             --server "${{ steps.tfout.outputs.sql_server_name }}"             --name "$RULE_NAME"             --start-ip-address "$RUNNER_IP"             --end-ip-address "$RUNNER_IP" 1>/dev/null

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore & build migrations runner
        working-directory: src/migrations/ComptaPlus.Migrations
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Run DbUp migrations (directory + core)
        working-directory: src/migrations/ComptaPlus.Migrations
        env:
          SQL_SERVER_FQDN: ${{ steps.tfout.outputs.sql_server_fqdn }}
          DIRECTORY_DB_NAME: ${{ steps.tfout.outputs.directory_db_name }}
          CORE_DB_NAME: ${{ steps.tfout.outputs.core_db_name }}
          MIGRATIONS_ROOT: ${{ github.workspace }}/db/migrations
        run: dotnet run -c Release --no-build

      - name: Remove SQL firewall rule (always)
        if: always()
        shell: bash
        run: |
          set +e
          az sql server firewall-rule delete             --resource-group "${{ steps.tfout.outputs.resource_group_name }}"             --server "${{ steps.tfout.outputs.sql_server_name }}"             --name "${{ steps.fw.outputs.rule_name }}"
